<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>POS System Planning Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column of question cards; language switch and progress in the header; submit panel at the end */
:root{
  --bg:#f3f5f6; --surface:#fff; --ink:#18232b; --muted:#5d6b75; --line:#d7dee3;
  --accent:#0d6b73; --accent-soft:#e1f0f1; --warn:#a6461f; --ok:#2f7a3c;
  --f-display:"Noto Serif SC","Songti SC",Georgia,serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11181d; --surface:#18222a; --ink:#e4ebef; --muted:#9aa9b3; --line:#2c3a44;
  --accent:#5cc3ca; --accent-soft:#163338; --warn:#f0936b; --ok:#7fcf8b; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:16px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-size:1.75rem;line-height:1.25;margin:0;text-wrap:balance}
.lead{white-space:pre-line;margin:0;color:var(--muted);max-width:62ch}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;border-radius:0;padding:6px 12px;background:var(--surface)}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--surface)}
.progress{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--f-display);font-size:1.2rem;margin:0;display:flex;gap:10px;align-items:baseline}
h2 .n{font-family:var(--f-mono);font-size:.8rem;color:var(--accent)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.q label{font-weight:500}
.q .qn{font-family:var(--f-mono);font-size:.85em;color:var(--accent);margin-right:.5em}
.hint{font-size:.85rem;color:var(--muted);margin-top:-4px}
.opt{font-size:.8rem;color:var(--muted);font-weight:400}
textarea,input[type=text],input[type=email]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:72px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:6px;flex:none}
.privacy{background:var(--accent-soft);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;font-size:.92rem}
.privacy p{margin:0 0 6px}
button{font:inherit;cursor:pointer;border-radius:6px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:.92rem}
.status.err{color:var(--warn)} .status.ok{color:var(--ok)}
.done{background:var(--surface);border:1px solid var(--ok);border-radius:8px;padding:20px}
footer{font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="toprow">
      <span class="eyebrow" id="eyebrow"></span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="zh" aria-pressed="false">中文</button>
      </div>
    </div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <span class="progress" id="progress"></span>
  </header>

  <form id="form" novalidate></form>

  <footer id="footer"></footer>
</div>

<script src="./survey-config.js"></script>
<script>
const CONFIG = globalThis.SURVEY_CONFIG;
const ONLINE = !!(CONFIG.supabase.url && CONFIG.supabase.anonKey);

const T = {
  en:{eyebrow:"Auckland · POS system planning",
      title:"POS System Planning Questionnaire",
      lead:`Hi Luis,\n\nWhen we last worked together on an installation, you shared your vision for your own POS system, with AI customer support to improve service efficiency and Facebook advertising and other online marketing channels to attract more customers and improve overall profitability. You also suggested that we work on the system together, drawing on my software development experience. I think this direction has real potential and offers a promising business opportunity. I have put together this survey to draw on your first-hand experience, help me clarify the product priorities, and help us work out how to collaborate and turn the idea into a practical plan. Please allow around 20–30 minutes. Estimates and examples are welcome, and you can skip anything you are unsure about or would prefer to discuss in person.`,
      progress:(a,b)=>`${a} of ${b} questions answered`,
      optional:"optional",
      about:"Your details",
      fields:{company:"Company name",website:"Website",name:"Your name",role:"Your role",email:"Email",phone:"Phone"},
      privacyTitle:"How I use your answers",
      privacy:[
        `Your answers are used only for planning our POS system and our cooperation. I do not sell them or publish them.`,
        "Please do not include your customers' personal information or confidential contract documents.",
        ...(ONLINE?[CONFIG.providerNote.en]:[]),
        CONFIG.retentionNote.en,
        `You can ask to see, correct or delete your answers at ${CONFIG.contactEmail}.`],
      consent:"I agree to these terms and to sharing my answers with the product team.",
      contactOk:"You may contact me to follow up on these answers and our working arrangements.",
      submit:"Submit answers", download:"Download answers", copy:"Copy answers",
      noBackend:`After finishing, download or copy your answers and email them to ${CONFIG.contactEmail}.`,
      needConsent:"Please tick the agreement box first.", needCompany:"Please enter your company name.",
      sending:"Sending…", sent:"Thank you. Your answers have been received.",
      sendFail:"Sending failed. Please download your answers and email them to me instead.",
      copied:"Copied. Paste them into an email to me.", copyFail:"Copy failed. Use Download instead.",
      draft:"Your answers are saved in this browser until you submit.",
      doneTitle:"Thank you", doneBody:"I will go through your answers and come back to you with next steps for working together. If you would like to add or change anything, you are welcome to answer again; I will read the latest answers together with the earlier ones.", again:"Answer again",
      footer:`POS system planning questionnaire · Questions: ${CONFIG.contactEmail}`},
  zh:{eyebrow:"奥克兰 · POS系统规划",
      title:"POS系统规划问卷",
      lead:`Luis 您好，\n\n上次一起做安装时，您提到，希望打造自己的POS系统，并通过AI智能客服提升服务效率、借助Facebook广告等网络营销方式拓展客户，从而提高整体盈利能力，也希望发挥我的软件开发经验，一起把这个想法做起来。我觉得这个方向很有潜力，也有不错的商业前景。为了进一步明确产品重点和合作方式，我整理了这份问卷，希望结合您的一线经验，把接下来的计划做得更具体。填写约需20–30分钟，欢迎提供大致数据或实际案例；不确定或希望当面讨论的问题，可以先跳过。`,
      progress:(a,b)=>`已回答 ${a} / ${b} 题`,
      optional:"选填",
      about:"您的信息",
      fields:{company:"公司名称",website:"官网",name:"您的姓名",role:"您的职位",email:"邮箱",phone:"电话"},
      privacyTitle:"我如何使用您的回答",
      privacy:[
        `您的回答只用于我们的POS系统规划与合作安排。我不会出售，也不会公开。`,
        "请不要填写您客户的个人信息或保密合同内容。",
        ...(ONLINE?[CONFIG.providerNote.zh]:[]),
        CONFIG.retentionNote.zh,
        `如需查看、更正或删除您的回答，请联系 ${CONFIG.contactEmail}。`],
      consent:"我同意以上说明，并同意将回答提供给产品团队。",
      contactOk:"可以就这些回答和合作安排与我联系。",
      submit:"提交答卷", download:"下载答卷", copy:"复制答卷",
      noBackend:`填写完成后，请下载或复制答卷，发送到 ${CONFIG.contactEmail}。`,
      needConsent:"请先勾选同意。", needCompany:"请填写公司名称。",
      sending:"正在提交…", sent:"谢谢，我已收到您的回答。",
      sendFail:"提交失败。请下载答卷并通过邮件发给我。",
      copied:"已复制，请粘贴到邮件发给我。", copyFail:"复制失败，请使用下载。",
      draft:"提交前，您的回答会保存在本浏览器中。",
      doneTitle:"谢谢", doneBody:"我会仔细阅读您的回答，并就下一步合作安排与您联系。如果您想补充或修改，欢迎重新答卷；我会把最新的回答和之前的一起阅读。", again:"重新答卷",
      footer:`POS系统规划问卷 · 联系：${CONFIG.contactEmail}`}
};

/* Partner-facing questions. Internal notes, our price points and post-interview analysis are intentionally left out. */
const SECTIONS = [
 {id:"s1",en:"Your business and clients",zh:"贵公司与客户",qs:[
  {id:"q1",en:"If you don't mind sharing, how many technicians are on your team, and which parts of Auckland (or beyond) do you usually cover?",zh:"方便的话，想了解一下：贵公司有几位技术人员？平时主要覆盖奥克兰哪些区域（或奥克兰以外）？"},
  {id:"q2",en:"Roughly how many client stores do you look after, and how many new installs do you do in a typical year? A rough range is perfectly fine.",zh:"大约服务多少家门店？一年大概新装多少家？给个大致范围就可以。"},
  {id:"q3",en:"Roughly how are your clients spread across supermarkets, convenience stores, restaurants, cafés, bubble tea and quick-service shops, other retail, and anything else?",zh:"您的客户大致是怎样的业态分布：超市、便利店、餐厅、咖啡馆、奶茶店和快餐店、其他零售，以及其他？"},
  {id:"q3b",en:"Among your food and drink clients, about how many order and pay at the counter (pay first), and how many use table service (pay after the meal)?",zh:"在您的餐饮客户里，大约有多少是在柜台点单、先付款的，多少是服务员点单、吃完再付的？"},
  {id:"q4",en:"Roughly what share of your clients are Asian-owned, and which language do they usually prefer for training and support?",zh:"客户中亚洲业主大约占多少？他们在培训和售后时一般习惯用哪种语言？"}]},
 {id:"s2",en:"What your clients use today",zh:"客户现在用的POS",qs:[
  {id:"q5",en:"Which POS systems do you install or support today? I have seen Moni, SIPO, Idealpos and Lightspeed on your website, so please correct me if I am missing any. Roughly how many shops use each?",zh:"您目前安装或维护哪些POS？我在贵公司网站上看到有 Moni、SIPO、Idealpos 和 Lightspeed，如有遗漏请您指正。各自大约有多少家门店在用？"},
  {id:"q6",en:"Which POS systems do your food and drink clients (especially bubble tea and quick-service shops) use most?",zh:"您的餐饮客户（尤其是奶茶店和快餐店）最常用哪些POS？"},
  {id:"q7",en:"I saw the Shoptech × Moni 2026 winter package advertised at NZ$99 + GST a month over 36 months. Could you tell me whether it still applies, what equipment and services it includes, and what is charged separately? And how are other systems usually rented?",zh:"我看到贵公司与 Moni 合作的 2026 年冬季套餐标注为每月 NZ$99 + GST、租期 36 个月。方便介绍一下目前是否仍适用、包含哪些设备和服务、哪些费用另计吗？其他系统的租用方式又通常是怎样的？"},
  {id:"q7b",en:"If a shop would like to change POS while still within its rental term, what has worked in your experience (for example swapping the system, taking over the remaining payments, or waiting until the term ends)? There is no need to share any contract details.",zh:"如果有门店想在租期内更换POS，据您的经验有哪些做法可行（比如更换系统、承接剩余租金、等租期结束）？不需要透露任何合同细节。"},
  {id:"q8",en:"In your experience, what makes your clients choose a POS or decide to switch?",zh:"据您的经验，客户选择或更换POS，最主要是出于什么原因？"},
  {id:"q9",en:"Which problems with current systems tend to take up most of your support time?",zh:"现有系统的哪些问题，通常最占用您的售后时间？"}]},
 {id:"s3",en:"Hardware and supply",zh:"硬件与供货",qs:[
  {id:"q10",en:"Roughly what share of your clients' counters use Android all-in-one terminals, iPads or Windows touchscreens?",zh:"您客户的收银台大致有多少用安卓一体机、iPad、Windows 触摸屏？"},
  {id:"q11",en:"Which terminal brands (such as iMin, Sunmi, Elo or Posiflex) do you like to install, and what do you like about them?",zh:"您比较愿意安装哪些一体机品牌（如 iMin、商米、Elo、Posiflex）？它们好在哪里？"},
  {id:"q12",en:"Only if you are comfortable sharing: what price ranges should I keep in mind for an all-in-one terminal, kitchen printer, label printer, cash drawer and EFTPOS terminal for our pilot shops?",zh:"如果您方便分享：为试点门店配置一体机、厨房打印机、标签机、钱箱和 EFTPOS 机，各项我大概应该按怎样的价格区间来规划？"},
  {id:"q13",en:"Which parts fail most often, and how do you usually handle warranty, swaps and spare units?",zh:"哪些部件最常出问题？保修、换机和备用机一般是怎么处理的？"},
  {id:"q14",en:"For cup and item labels, which printers and label sizes have worked well for you?",zh:"杯贴和商品标签方面，哪些打印机和标签尺寸用起来比较好？"}]},
 {id:"s4",en:"Payment terminals",zh:"支付终端",qs:[
  {id:"q15",en:"Which payment providers and terminals do your clients use (for example Windcave, Worldline, Verifone or Smartpay)?",zh:"您的客户用哪些支付服务商和终端（比如 Windcave、Worldline、Verifone、Smartpay）？"},
  {id:"q16",en:"Roughly what share of your clients have card payments connected to the POS, and what keeps the others from connecting?",zh:"大约多少客户的刷卡已经和POS集成？其余的没集成，主要是什么原因？"},
  {id:"q17",en:"When you set up integrated payments, what tends to go wrong most often, and who do you usually contact at the payment provider?",zh:"安装集成支付时，通常最容易出什么问题？在支付服务商那边一般找谁对接？"},
  {id:"q17b",en:"Have you worked with Eftpos NZ (Verifone) or Smartpay integrations? If so, roughly how long did setup and approval take?",zh:"您有没有做过 Eftpos NZ（Verifone）或 Smartpay 的集成？如果有，开通和审批大概花了多长时间？"}]},
 {id:"s5",en:"Installation and support",zh:"安装与售后",qs:[
  {id:"q18",en:"Could you walk me through a typical install: the steps, the time on site, and who enters the menu?",zh:"能否请您介绍一下一次典型的安装：步骤、现场需要多久、菜单由谁录入？"},
  {id:"q19",en:"How often do shop networks drop out, and what backup do you usually set up?",zh:"门店网络多久会断一次？您通常会配置什么备份方案？"},
  {id:"q20",en:"What are the most common reasons shops call you, and how quickly can you usually respond on weekdays, evenings and weekends?",zh:"门店最常因为什么事情联系您？工作日、晚上和周末，通常多久能响应？"},
  {id:"q21",en:"In your experience, which printer connection (network, USB or Bluetooth) has been the most reliable?",zh:"据您的经验，哪种打印机连接方式（网口、USB、蓝牙）最稳定？"}]},
 {id:"s6",en:"Bundled services",zh:"打包服务",qs:[
  {id:"q22",en:"Which of your other services (network, CCTV, digital menu boards, electronic shelf labels) do food and drink shops often ask for alongside a POS?",zh:"餐饮店在装POS时，还常会一起问到您的哪些服务（网络、CCTV、数字菜单屏、电子价签）？"},
  {id:"q23",en:"Would you be open to offering our POS together with your other services as a bundle? If so, how do you imagine packaging it?",zh:"您是否愿意把我们的POS和您的其他服务打包提供？如果愿意，您设想怎样组合？"}]},
 {id:"s7",en:"Product planning",zh:"产品规划",qs:[
  {id:"q24",en:"What do bubble tea and quick-service shops most need that current systems do not do so well?",zh:"奶茶店和快餐店最需要、但现有系统做得不太好的是什么？"},
  {id:"q24b",en:"For these shops, which features would you like us to get right first?",zh:"针对这些门店，您希望我们的系统优先做好哪些功能？"},
  {id:"q25",en:"The core features I am planning are integrated card payments on Android terminals, one label per cup, bilingual Chinese/English, careful handling when a card payment result is unclear, and local on-site support. How would you rank them for your clients, and is anything missing?",zh:"我计划的核心功能是：安卓一体机集成刷卡、每杯一张杯贴、中英双语、刷卡结果不明时的稳妥处理，以及本地上门支持。就您的客户而言，您会怎样给它们排序？还有什么遗漏吗？"},
  {id:"q26",en:"I am thinking of offering the system as a rental covering both hardware and software, similar to current business rentals. Do your clients tend to prefer renting or buying outright, and what would make our rental attractive to them?",zh:"我打算以租用方式提供（含硬件和软件），与现有 business rental 类似。您的客户更倾向租还是直接购买？怎样的租用方案会更吸引他们？"},
  {id:"q27",en:"What would help you feel confident installing and recommending the system (for example training, documentation, test units or a direct support line)?",zh:"要让您放心地安装和推荐这套系统，哪些支持会有帮助（比如培训、资料、测试机、直接的技术支持渠道）？"}]},
 {id:"s8",en:"How we work together",zh:"合作方式",qs:[
  {id:"q28",en:"I would love to work together on on-site installation and first-line support. How would you imagine dividing the work between us, and what kind of fees (per install or per month) would feel fair to you?",zh:"我很希望能和您一起承担现场安装和一线售后。您觉得我们怎样分工比较合适？按次或按月怎样收费，您会觉得合理？"},
  {id:"q29",en:"For referrals or resale, what arrangement would feel comfortable for you (a one-off fee, a share of the monthly fee, or something else)?",zh:"关于客户推荐或代理，您觉得怎样的安排比较合适（一次性费用、月费分成，或其他方式）？"},
  {id:"q30",en:"Which of your clients might be open to a free pilot, and how could we approach them together? When would suit you best, for example some time next year?",zh:"您的哪些客户可能愿意参加免费试点？我们可以怎样一起去沟通？什么时候对您比较合适，比如明年的某个时间？"},
  {id:"q31",en:"How would you like us to keep in touch day to day (contact person, channel, regular check-ins)? And is there anything else you would like me to know?",zh:"日常怎样保持联系您会觉得方便（对接人、渠道、定期碰头）？还有什么想让我了解的吗？"}]}
];

const KEY="retail-tech-survey-draft-v3";
const $=s=>document.querySelector(s);
let lang=(navigator.language||"").toLowerCase().startsWith("zh")?"zh":"en";
let state={meta:{},answers:{},consent:false,contactOk:false};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)state=Object.assign(state,s)}catch(e){}
state.meta={company:"SHOPTECH",...state.meta};

function h(tag,attrs={},kids=[]){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="text")e.textContent=v;else e.setAttribute(k,v)}for(const c of [].concat(kids))if(c!=null)e.append(c);return e}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const totalQs=SECTIONS.reduce((n,s)=>n+s.qs.length,0);

function render(){
  const t=T[lang];document.documentElement.lang=lang==="zh"?"zh-CN":"en";
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  $("#eyebrow").textContent=t.eyebrow;$("#title").textContent=t.title;$("#lead").textContent=t.lead;$("#footer").textContent=t.footer;
  document.title=t.title;
  const f=$("#form");f.innerHTML="";
  if(state.submitted){
    const again=h("button",{type:"button",class:"primary",id:"againBtn",text:t.again});
    again.addEventListener("click",()=>{state={meta:{company:"SHOPTECH"},answers:{},consent:false,contactOk:false};persist();render();window.scrollTo(0,0)});
    f.append(h("div",{class:"done"},[h("h2",{text:t.doneTitle}),h("p",{text:t.doneBody}),again]));$("#progress").textContent="";return}


  const about=h("section",{},[h("h2",{},[h("span",{class:"n",text:"00"}),t.about])]);
  const g=h("div",{class:"grid2"});
  for(const k of ["company","website","name","role","email","phone"]){
    const id="m_"+k,req=k==="company";
    const lab=h("label",{for:id},[t.fields[k],req?null:h("span",{class:"opt",text:" · "+t.optional})]);
    const inp=h("input",{id,name:id,type:k==="email"?"email":"text",autocomplete:{name:"name",email:"email",phone:"tel",company:"organization",website:"url",role:"organization-title"}[k]});
    inp.value=state.meta[k]||"";
    inp.addEventListener("input",e=>{state.meta[k]=e.target.value;persist()});
    g.append(h("div",{class:"q"},[lab,inp]));
  }
  about.append(g);f.append(about);

  let qn=0;
  SECTIONS.forEach((s,si)=>{
    const sec=h("section",{id:s.id},[h("h2",{},[h("span",{class:"n",text:String(si+1).padStart(2,"0")}),s[lang]])]);
    s.qs.forEach(q=>{
      const id="a_"+q.id;const ta=h("textarea",{id,name:id,rows:"3"});ta.value=state.answers[q.id]||"";
      ta.addEventListener("input",e=>{state.answers[q.id]=e.target.value;persist();progress()});
      qn++;sec.append(h("div",{class:"q"},[h("label",{for:id},[h("span",{class:"qn",text:qn+"."}),q[lang]]),ta]));
    });
    f.append(sec);
  });

  const priv=h("section",{},[h("h2",{text:t.privacyTitle}),h("div",{class:"privacy"},t.privacy.map(p=>h("p",{text:p})))]);
  const c1=h("input",{type:"checkbox",id:"consent"});c1.checked=!!state.consent;c1.addEventListener("change",e=>{state.consent=e.target.checked;persist()});
  priv.append(h("label",{class:"check",for:"consent"},[c1,h("span",{text:t.consent})]));
  const c2=h("input",{type:"checkbox",id:"contactOk"});c2.checked=!!state.contactOk;c2.addEventListener("change",e=>{state.contactOk=e.target.checked;persist()});
  priv.append(h("label",{class:"check",for:"contactOk"},[c2,h("span",{text:t.contactOk})]));
  f.append(priv);

  const hp=h("input",{type:"text",name:"website_confirm",id:"hp",tabindex:"-1",autocomplete:"off","aria-hidden":"true",style:"position:absolute;left:-9999px;width:1px;height:1px;opacity:0"});
  f.append(hp);
  const status=h("p",{class:"status",id:"status",text:ONLINE?t.draft:t.noBackend});
  const acts=h("div",{class:"actions"});
  if(ONLINE){const b=h("button",{type:"submit",class:"primary",id:"submitBtn",text:t.submit});acts.append(b)}
  const dl=h("button",{type:"button",id:"dlBtn",text:t.download,class:ONLINE?"":"primary"});
  const cp=h("button",{type:"button",id:"cpBtn",text:t.copy});
  acts.append(dl,cp);
  f.append(h("section",{},[acts,status]));
  dl.addEventListener("click",()=>{if(!check())return;download()});
  cp.addEventListener("click",()=>{if(!check())return;copy()});
  progress();
}

function progress(){const a=Object.values(state.answers).filter(v=>v&&v.trim()).length;$("#progress").textContent=T[lang].progress(a,totalQs)}
function setStatus(msg,cls){const s=$("#status");if(s){s.textContent=msg;s.className="status "+(cls||"")}}
function check(){
  const t=T[lang];
  if(!(state.meta.company||"").trim()){setStatus(t.needCompany,"err");$("#m_company").focus();return false}
  if(!state.consent){setStatus(t.needConsent,"err");$("#consent").focus();return false}
  return true;
}
function payload(){
  const answers=[];
  for(const s of SECTIONS)for(const q of s.qs){const v=(state.answers[q.id]||"").trim();if(v)answers.push({id:q.id,section:s.en,question:q.en,answer:v})}
  const meta=Object.fromEntries(Object.entries(state.meta).map(([k,v])=>[k,(v||"").trim()]));
  if(!state.contactOk){delete meta.email;delete meta.phone}
  return {survey:"retail-tech-partner-v1",submittedAt:new Date().toISOString(),language:lang,consent:true,contactOk:!!state.contactOk,meta,answers};
}
function row(){
  const p=payload();
  return {survey:p.survey,company:p.meta.company||null,contact_ok:p.contactOk,language:p.language,payload:p};
}
function asText(p){
  const L=[`${T.en.title} / ${T.zh.title}`,`Company: ${p.meta.company||""}`,`Website: ${p.meta.website||""}`,`Name: ${p.meta.name||""} · Role: ${p.meta.role||""}`];
  if(p.contactOk)L.push(`Email: ${p.meta.email||""} · Phone: ${p.meta.phone||""}`);
  L.push(`Contact OK: ${p.contactOk?"yes":"no"} · Submitted: ${p.submittedAt}`,"");
  for(const a of p.answers)L.push(`[${a.id}] ${a.question}`,a.answer,"");
  return L.join("\n");
}
function download(){
  const p=payload();const blob=new Blob([asText(p)+"\n\n---\n"+JSON.stringify(p,null,2)],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`survey-${(p.meta.company||"answers").replace(/[^\w-]+/g,"_")}.txt`;document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function copy(){
  const t=T[lang],txt=asText(payload());
  try{await navigator.clipboard.writeText(txt);setStatus(t.copied,"ok")}
  catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.append(ta);ta.select();
    try{document.execCommand("copy");setStatus(t.copied,"ok")}catch(_){setStatus(t.copyFail,"err")}ta.remove()}
}
$("#form").addEventListener("submit",async e=>{
  e.preventDefault();const t=T[lang];if(!ONLINE||!check())return;
  const b=$("#submitBtn");b.disabled=true;setStatus(t.sending);
  try{
    if(($("#hp")||{}).value){state={meta:{},answers:{},consent:false,contactOk:false,submitted:true};persist();render();return}
    const sb=CONFIG.supabase;
    const r=await fetch(sb.url.replace(/\/$/,"")+"/rest/v1/"+sb.table,{method:"POST",
      headers:{"Content-Type":"application/json","apikey":sb.anonKey,"Prefer":"return=minimal"},
      body:JSON.stringify(row())});
    if(!r.ok)throw new Error(r.status);
    state={meta:{},answers:{},consent:false,contactOk:false,submitted:true};persist();render();
  }catch(err){setStatus(t.sendFail,"err");b.disabled=false}
});
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;render()}));
render();
</script>
</body>
</html>
